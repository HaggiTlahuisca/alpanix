name: Build Capacitor Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Cambia este número si usas una versión más antigua de Node

      - name: Instalar dependencias de Node
        run: npm install

      - name: Compilar la web
        run: npm run build

      - name: Sincronizar con Capacitor Android
        run: npx cap sync android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK de Android
        run: cd android && ./gradlew assembleDebug

      - name: Guardar el APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-APK-Generados
          path: android/app/build/outputs/apk/**/*.apk
